# ============================================
# PrepWise — Kubernetes Deployment
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prepwise
  labels:
    app: prepwise
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prepwise
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: prepwise
    spec:
      containers:
        - name: prepwise
          image: IMAGE_TAG
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            # Server-side secrets (from K8s secret)
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: prepwise-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: prepwise-secrets
                  key: FIREBASE_CLIENT_EMAIL
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: prepwise-secrets
                  key: FIREBASE_PRIVATE_KEY
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prepwise-secrets
                  key: GOOGLE_GENERATIVE_AI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: acr-secret
